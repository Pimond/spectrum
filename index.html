<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Live audio spectrum analyzer with spectrum, bars, waterfall, scope and 3D views, plus background-noise zeroing. Runs in the browser.">
<title>Audio spectrum analyzer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f4f3ef'/%3E%3Cpath d='M3 22h5l3-13 4 17 4-21 3 17h7' fill='none' stroke='%23c63a17' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try{if(JSON.parse(localStorage.getItem('spectrum.v2')||'{}').dark===true)document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f3ef; --ink:#16181a; --muted:#676b6f;
  --line:rgba(22,24,26,.13); --line2:rgba(22,24,26,.28); --hover:rgba(22,24,26,.06); --veil:rgba(244,243,239,.84);
  --accent:#c63a17; --accent-ink:#ffffff;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --ctl:44px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --edge:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101112; --ink:#ecebe7; --muted:#8f9194;
  --line:rgba(236,235,231,.13); --line2:rgba(236,235,231,.3); --hover:rgba(236,235,231,.08); --veil:rgba(16,17,18,.84);
  --accent:#ff6a3d; --accent-ink:#1c0a04;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;border-radius:var(--r-md)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* one button pair */
.btn{height:var(--ctl);padding:0 18px;border:1px solid var(--line2);font-weight:500;white-space:nowrap;
  transition:background-color .12s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{color:var(--muted);cursor:default}
.icon-btn{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;flex:none;transition:background-color .12s}
.icon-btn svg{width:20px;height:20px}
@media (hover:hover){
  .btn:not(.btn--primary):not(.on):not(:disabled):hover,.icon-btn:hover{background:var(--hover)}
  .btn--primary:hover{filter:brightness(1.07)}
}

#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100vh;height:100dvh;
  padding:var(--st) var(--sr) 0 var(--sl)}

/* header: tabs, readout, theme */
header{display:flex;flex-wrap:wrap;align-items:center;column-gap:20px;padding:6px var(--edge) 0;border-bottom:1px solid var(--line)}
.readout{flex:1 1 0;overflow:hidden;display:flex;align-items:baseline;gap:16px;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.readout span{display:flex;align-items:baseline;gap:6px;font-size:13px}
.readout b{font-weight:500}
.readout .main{font-size:21px;letter-spacing:-.01em}
#btnTheme{margin-right:-10px}
#tabs{order:3;flex:1 0 100%;display:flex;gap:4px;margin:0 -8px}
#tabs button{flex:1;min-width:0;height:var(--ctl);border-radius:0;font-size:14px;color:var(--muted);font-weight:500;
  box-shadow:inset 0 -2px 0 transparent;transition:color .12s,box-shadow .12s}
#tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
@media (hover:hover){#tabs button:hover{color:var(--ink)}}
@media (max-width:360px){.readout .lvl{display:none}}
@media (min-width:820px){
  :root{--edge:24px}
  header{flex-wrap:nowrap;padding-top:0}
  #tabs{order:0;flex:0 0 auto;margin:0 0 0 -14px;gap:0}
  #tabs button{flex:none;padding:0 14px;height:52px}
  .readout{flex:0 1 auto;margin-left:auto;gap:24px}
  #btnTheme{margin-left:0}
}

/* plot */
#plot{position:relative;flex:1;min-height:0;overflow:hidden}
#plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cgl{display:none}
#c2d{touch-action:none;cursor:crosshair}
#zoomer{position:absolute;right:calc(var(--edge) + var(--sr));top:12px;display:grid;grid-template-columns:auto 40px 40px;align-items:center;
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-md);overflow:hidden}
#zoomer span{font-family:var(--mono);font-size:11px;color:var(--muted);padding:0 8px 0 10px}
#zoomer button{height:38px;border-radius:0;font-size:18px;line-height:1;border-left:1px solid var(--line);transition:background-color .12s}
#zoomer .y,#zoomer .y~button{border-top:1px solid var(--line)}
#zoomer .y{align-self:stretch;display:flex;align-items:center}
#zoomer button[data-z="r"]{grid-column:1/-1;height:34px;font-size:12px;color:var(--muted);border-left:0}
#zoomer button:active{background:var(--hover)}
@media (hover:hover){#zoomer button:hover{background:var(--hover);color:var(--ink)}}

#intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:var(--edge);background:var(--veil)}
.pick{width:min(300px,100%);display:flex;flex-direction:column;gap:10px}
.pick .btn{width:100%;height:52px;background-color:var(--bg)}
.pick .btn--primary{background-color:var(--accent)}

#zeroOverlay{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(320px,calc(100% - 2*var(--edge)));
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-lg);padding:12px 14px;pointer-events:none}
#zeroOverlay .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:10px}
#zeroOverlay .top b{font-family:var(--mono);font-weight:500;font-size:18px}
#zeroOverlay .track{height:3px;background:var(--line)}
#zeroBar{height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}

#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,6px);max-width:calc(100% - 2*var(--edge));
  background:var(--ink);color:var(--bg);border-radius:var(--r-md);padding:9px 14px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* action bar */
#bar{padding:10px var(--edge) calc(10px + var(--sb));border-top:1px solid var(--line)}
#bar .acts{display:flex;gap:10px}
#bar .btn{flex:1;min-width:0;padding:0 10px}
#transport{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
#seek{flex:1;min-width:0;width:auto;height:var(--ctl);margin:0}
.tog[aria-pressed="false"]{color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (hover:hover){.tog[aria-pressed="true"]:hover{background:var(--ink)}}
@media (min-width:820px){#bar{display:flex;align-items:center;gap:24px}#transport{flex:1;margin:0;max-width:640px}#bar .acts{margin-left:auto}#bar .btn{flex:0 0 190px}}

/* settings */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .18s;z-index:10}
#sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);border-top:1px solid var(--line2);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:6px var(--edge) calc(18px + var(--sb));transform:translateY(102%);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sheet-open #backdrop{opacity:1}
.sheet-open #sheet{transform:none}
@media (min-width:820px){
  #sheet{left:auto;top:0;bottom:0;width:380px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line2);transform:translateX(102%)}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0;margin-right:-10px}
.sheet-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:60px;padding:8px 0;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r-md);overflow:hidden;flex:none}
.seg button{height:38px;padding:0 11px;border-radius:0;font-size:14px;font-weight:500;transition:background-color .12s}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (hover:hover){.seg button:not([aria-pressed="true"]):hover{background:var(--hover)}}
select{height:38px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line2);padding:0 8px;font-size:14px}
input[type=range]{width:150px;accent-color:var(--ink)}
.switch{-webkit-appearance:none;appearance:none;width:46px;height:26px;border-radius:13px;background:transparent;border:1px solid var(--line2);
  position:relative;cursor:pointer;transition:background-color .12s;margin:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .12s,background-color .12s}
.switch:checked{background:var(--ink);border-color:var(--ink)}
.switch:checked::after{transform:translateX(20px);background:var(--bg)}
.actions{display:flex;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.actions .btn{flex:1;padding:0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <nav id="tabs" role="tablist" aria-label="Graph type">
      <button role="tab" data-view="spectrum">Spectrum</button>
      <button role="tab" data-view="bars">Bars</button>
      <button role="tab" data-view="waterfall">Waterfall</button>
      <button role="tab" data-view="scope">Scope</button>
      <button role="tab" data-view="3d">3D</button>
    </nav>
    <div class="readout">
      <span><b class="main" id="readF">—</b></span>
      <span><b id="readN">—</b></span>
      <span class="lvl"><b id="readD">—</b></span>
    </div>
    <button id="btnTheme" class="icon-btn" aria-pressed="false" aria-label="Switch to dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="plot">
    <canvas id="cgl"></canvas>
    <canvas id="c2d"></canvas>

    <div id="zoomer" aria-label="Zoom">
      <span>X</span><button data-z="x-" aria-label="Zoom out horizontally">−</button><button data-z="x+" aria-label="Zoom in horizontally">+</button>
      <span class="y">Y</span><button data-z="y-" aria-label="Zoom out vertically">−</button><button data-z="y+" aria-label="Zoom in vertically">+</button>
      <button data-z="r">Reset</button>
    </div>

    <div id="intro">
      <div class="pick">
        <button class="btn btn--primary" data-src="mic">Use the microphone</button>
        <button class="btn" data-src="file">Open an audio file</button>
      </div>
    </div>

    <div id="zeroOverlay" hidden role="status">
      <div class="top"><span>Measuring the background</span><b id="zeroCount">3</b></div>
      <div class="track"><div id="zeroBar"></div></div>
    </div>
    <div id="toast" role="status"></div>
  </main>

  <footer id="bar" hidden>
    <div id="transport" hidden>
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Seek">
      <span id="tDur">0:00</span>
      <button id="btnLoop" class="icon-btn tog" aria-pressed="true" aria-label="Loop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1"/></svg>
      </button>
      <button id="btnMute" class="icon-btn tog" aria-pressed="false" aria-label="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5zM16 9l5 6M21 9l-5 6"/></svg>
      </button>
    </div>
    <div class="acts">
      <button id="btnZero" class="btn" aria-pressed="false">Zero background</button>
      <button id="btnPlay" class="btn btn--primary">Pause</button>
      <button id="btnSettings" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
      </button>
    </div>
  </footer>
</div>

<div id="backdrop" hidden></div>
<aside id="sheet" hidden aria-label="Settings">
  <div class="sheet-head"><h2>Settings</h2>
    <button id="sheetClose" class="icon-btn" aria-label="Close settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="row"><span>Input</span>
    <div class="seg" data-seg="source"><button data-val="mic">Mic</button><button data-val="file">File</button></div></div>
  <div class="row"><span>Frequency scale</span>
    <div class="seg" data-seg="scale"><button data-val="log">Log</button><button data-val="lin">Linear</button></div></div>
  <div class="row"><label for="fft">FFT size</label>
    <select id="fft">
      <option value="1024">1024</option><option value="2048">2048</option><option value="4096">4096</option>
      <option value="8192">8192</option><option value="16384">16384</option><option value="32768">32768</option>
    </select></div>
  <div class="row"><label for="smooth">Smoothing</label><input type="range" id="smooth" min="0" max="0.95" step="0.05"></div>
  <div class="row"><label for="hold">Peak hold</label><input type="checkbox" class="switch" id="hold"></div>
  <div class="row"><span>Colors</span>
    <div class="seg" data-seg="lut"><button data-val="aurora">Aurora</button><button data-val="viridis">Viridis</button><button data-val="ice">Ice</button><button data-val="mono">Mono</button></div></div>
  <div class="actions"><button id="btnSnap" class="btn">Save image</button><button id="btnFull" class="btn">Fullscreen</button></div>
</aside>
<input type="file" id="fileInput" accept="audio/*" hidden>

<script src="core.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
